name: Import verified regelingen integration
on:
  push:
    branches: [feat/regelingen-platform-foundation]
    paths: [.github/workflows/import-regelingen-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact reviewed baseline
        run: test "$(git rev-parse HEAD^)" = '397d668d464b455e5bc24b1071ade003a65676c1'
      - name: Import hash-verified text sources only
        env:
          SOURCE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-5218-81f4-8972-3c5a16253542/raw?se=2026-11-14T14%3A35%3A47Z&sp=r&sv=2026-06-06&sr=b&scid=7d009f7b-3b40-5fb5-b851-7868dd451586&skoid=a4604a88-85e4-4562-b6ab-a5622268de80&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-14T05%3A49%3A48Z&ske=2026-11-15T05%3A49%3A48Z&sks=b&skv=2026-06-06&sig=LMhu2XaX6NopbJ9Bt/gckpGlIdrlyCO06T0/4wvpvdc%3D'
        run: |
          python3 <<'PY'
          import os, urllib.request, hashlib, io, zipfile, pathlib
          raw=urllib.request.urlopen(os.environ['SOURCE_URL'],timeout=30).read(200000)
          assert len(raw)==94876
          assert hashlib.sha256(raw).hexdigest()=='bee565d849bc1a5169cc345931d81226dbaad858e27f8c061b06c518ba5f3f94'
          allowed=set('''.github/workflows/live-check.yml
          .github/workflows/quality.yml
          .github/workflows/release.yml
          AGENTS.md
          README.md
          assets/app.js
          assets/regelingen-app.js
          assets/regelingen.css
          assets/style.css
          docs/DEVELOPMENT-HANDOFF.md
          docs/REGELINGEN-LIVE-INTEGRATION.md
          docs/V2-REGELINGEN-PLATFORM.md
          scripts/build-site.cjs
          scripts/check-live.cjs
          scripts/package.cjs
          scripts/regeling-pages.cjs
          scripts/regelingen-engine.cjs
          templates/index.html
          templates/regelingen-page.html
          tests/integration-regelingen.test.cjs
          tests/live-check.test.cjs
          tests/release-gates.test.cjs
          tests/visual.test.cjs'''.splitlines())
          root=pathlib.Path.cwd()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert set(z.namelist())==allowed and len(z.infolist())==len(allowed)
              assert sum(x.file_size for x in z.infolist())<1000000
              for name in sorted(allowed):
                  data=z.read(name);data.decode('utf8')
                  target=root/name
                  assert target.resolve().is_relative_to(root)
                  assert not target.is_symlink()
                  if name.startswith('.github/workflows/'):
                      assert target.read_bytes()==data, 'Workflow must already be applied by authorized connector'
                      continue
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
          print('Imported 20 application files; 3 pre-applied workflows verified unchanged.')
          PY
      - name: Build and test exact integrated release
        run: |
          php -v
          npm run build
          npm test
          npm run package
          node -e "if(require('./version.json').build!=='0c76f86e9de19a6d') process.exit(1)"
          git diff --exit-code -- assets/core.js assets/export.js assets/metrics.js server api admin .github/workflows
          git diff --check
      - name: Commit only application sources and generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'feat: connect regelingencheck to the complete SubsidieReady website'
          git push origin HEAD:refs/heads/feat/regelingen-platform-foundation
