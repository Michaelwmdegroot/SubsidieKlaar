name: SubsidieReady release
on:
  push:
    branches: [release/subsidieready-v1, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run build
      - name: Archive reproducible source
        run: tar --exclude=.git --exclude=node_modules -czf "$RUNNER_TEMP/subsidieready-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: subsidieready-source
          path: ${{ runner.temp }}/subsidieready-source.tar.gz
          retention-days: 3
