name: SubsidieReady NIVO fast-deploy source application
on:
  push:
    branches:
      - feat/mysql-account-storage-staging-2026-11-14
    paths:
      - tools/ci-source-patch.base64
permissions:
  contents: write
concurrency:
  group: subsidieready-nivo-source
  cancel-in-progress: false
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require PHP for existing backend suite
        run: |
          php -v
          php -r 'exit(extension_loaded("sodium") && extension_loaded("fileinfo") ? 0 : 1);'
      - name: Apply exact reviewed source changes
        run: |
          base64 -d tools/ci-source-patch.base64 | gzip -d > /tmp/subsidieready-source.patch
          git apply --check /tmp/subsidieready-source.patch
          git apply /tmp/subsidieready-source.patch
      - name: Build and test before any commit
        run: |
          npm run build
          npm test
          npm run package
          node scripts/audit-seo.cjs
          node scripts/lead-pilot.cjs --check
          git diff --check
      - name: Commit generated assets and push feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: NIVO operator, account terms, explicit marketing consent, safe MySQL production gates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
