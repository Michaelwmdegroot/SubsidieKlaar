name: SubsidieReady live acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - version.json
      - scripts/check-live.cjs
      - .github/workflows/live-check.yml
permissions:
  contents: read
concurrency:
  group: subsidieready-live-acceptance
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only public HTTP checks
        id: live
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4; do
            if node scripts/check-live.cjs; then exit 0; fi
            if [ "$attempt" != '4' ]; then sleep 15; fi
          done
          exit 1
      - name: Verify exact public integration assets
        id: images
        if: steps.live.outcome == 'success'
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const report=JSON.parse(fs.readFileSync('qa/live-check.json','utf8'));
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          (async()=>{
            for(const file of ['assets/mark.svg','assets/images/home-hero.webp','assets/images/home-hero-small.webp','assets/regelingen-engine.js','assets/regelingen-app.js','assets/regelingen.css','regelingen/index.html','subsidies/index.html','btw/index.html','financiering/index.html','assets/plan-core.js','assets/workbench-rules.js','assets/plan-app.js','assets/plan.css','assets/next-api.js','assets/sales-app.js','assets/advice-app.js','assets/plan-bridge.js','mijn-plan/index.html','advies/index.html','sales/index.html','bronbeheer/index.html','assets/images/dashboard-home.webp','assets/images/dashboard-home-small.webp','assets/images/dashboard-dossier.webp','assets/images/dashboard-sustainability.webp','assets/images/dashboard-trust.webp']){
              let pass=false;
              try {
                const expected=fs.readFileSync(file);
                const r=await fetch('https://subsidieready.nl/'+file,{method:'GET',credentials:'omit',redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(10000)});
                const type=file.endsWith('.svg')?'image/svg+xml':file.endsWith('.webp')?'image/webp':file.endsWith('.js')?'javascript':file.endsWith('.css')?'text/css':'text/html';
                if(r.status===200&&(r.headers.get('content-type')||'').includes(type)){
                  let size=0;const chunks=[];
                  for await(const chunk of r.body){size+=chunk.length;if(size>expected.length)throw Error('size');chunks.push(chunk);}
                  pass=hash(Buffer.concat(chunks))===hash(expected);
                } else if(r.body) await r.body.cancel();
              } catch {}
              report.checks.push({name:'Exact publiek bestand: '+file,pass,detail:''});
              console.log((pass?'PASS ':'FAIL ')+file);
            }
            report.ok=report.checks.every(x=>x.pass);
            fs.writeFileSync('qa/live-check.json',JSON.stringify(report,null,2)+'\n');
            if(!report.ok)process.exitCode=1;
          })().catch(()=>{process.exitCode=1;});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subsidieready-live-acceptance
          path: qa/live-check.json
          retention-days: 14
          if-no-files-found: error
      - name: Keep deployment acceptance separate from code quality
        if: steps.live.outcome != 'success' || steps.images.outcome != 'success'
        run: |
          echo 'NO-GO: the exact live release has not passed HTTP and integrated-asset acceptance. See the JSON report.'
          exit 1
