name: Import reviewed next-level testrelease
on:
  push:
    branches: [feat/nextlevel-testrelease]
    paths: [.github/workflows/import-nextlevel-test.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact unchanged main baseline
        run: test "$(git rev-parse HEAD^)" = '9158e019cbd52340d0fbc0d2d4b834f94b2d3a7d'
      - name: Import bounded hash-verified sources, no configuration or private data
        env:
          SOURCE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-a928-81f4-8f79-a314c288662a/raw?se=2026-11-14T15%3A40%3A23Z&sp=r&sv=2026-06-06&sr=b&scid=8af15cbb-7a9f-5aee-afc8-8a0bffd69337&skoid=a4604a88-85e4-4562-b6ab-a5622268de80&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-14T10%3A36%3A57Z&ske=2026-11-15T10%3A36%3A57Z&sks=b&skv=2026-06-06&sig=/nE2okw/Zvqt2RZuvxue4D8IUdZXuCoNRlpGU9b2FUA%3D'
        run: |
          python3 <<'PY'
          import pathlib,os,urllib.request,hashlib,zipfile,io
          raw=urllib.request.urlopen(os.environ['SOURCE_URL'],timeout=30).read(200000)
          assert len(raw)==115754
          assert hashlib.sha256(raw).hexdigest()=='289fb357abc2f40c3ccaf678b81a8d4e4bc4ac4adb9b1c37cd74d1e1cf42a9a1'
          allowed=set('''AGENTS.md
          README.md
          api/next/index.php
          assets/advice-app.js
          assets/app.js
          assets/next-api.js
          assets/plan-app.js
          assets/plan-bridge.js
          assets/plan-core.js
          assets/plan.css
          assets/sales-app.js
          assets/workbench-rules.js
          docs/next/RELEASE-STATUS.md
          docs/next/SECURITY.md
          docs/next/STAGING.md
          docs/next/TESTEN.md
          docs/next/config.example.php
          package.json
          scripts/next/browser-check.py
          scripts/next/browser-fixtures.py
          scripts/next/build.cjs
          scripts/next/check-sources.cjs
          scripts/next/mail-worker.php
          scripts/next/maintenance.php
          scripts/next/offline.cjs
          scripts/next/restore.php
          scripts/next/router.php
          scripts/next/setup.php
          scripts/next/snapshot.php
          scripts/next/start-local.sh
          scripts/package.cjs
          scripts/serve.cjs
          server/next/service.php
          tests/next-model.test.cjs
          tests/next-server.test.cjs'''.splitlines())
          root=pathlib.Path.cwd()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert set(z.namelist())==allowed and len(z.infolist())==len(allowed)
              assert sum(x.file_size for x in z.infolist())<500000
              for name in sorted(allowed):
                  target=root/name
                  assert target.resolve().is_relative_to(root) and not target.is_symlink()
                  data=z.read(name);data.decode('utf8')
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
          print('35 reviewed source files imported. No live data, credentials or fonts.')
          PY
      - name: Verify code, actual local PHP API and build reproducibility
        run: |
          php -v
          php -r 'exit(extension_loaded("sodium") && extension_loaded("fileinfo") ? 0 : 1);'
          npm run build
          npm test
          npm run package
          npm run preview:next
          node -e "if(require('./next-version.json').build!=='adf1bc144d1f8db0') process.exit(1)"
          git diff --exit-code -- assets/core.js assets/export.js assets/metrics.js server/bootstrap.php api/health.php api/settings.php api/event.php admin/index.php .github/workflows
          git diff --check
      - name: Commit application files to test branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'feat: build next-level plans workbenches accounts vault and private sales beta'
          git push origin HEAD:refs/heads/feat/nextlevel-testrelease
