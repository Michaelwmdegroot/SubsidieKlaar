name: SubsidieReady TBT advice target preflight

# Historical TBT monitor: explicit manual use only, no longer a SubsidieReady lead destination.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tbt-target:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Chromium
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Test TBT advice form and tracking before consent
        id: preflight
        continue-on-error: true
        run: |
          # Retry once on transient reachability failures. The final result
          # still fails closed; no credentials or customer data are sent.
          for attempt in 1 2; do
            if python scripts/live/tbt-target-check.py; then exit 0; fi
            if [ "$attempt" != 2 ]; then sleep 20; fi
          done
          exit 1
      - name: Retain safe target inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tbt-target-readonly
          path: qa/tbt-target/report.json
          retention-days: 14
          if-no-files-found: warn
      - name: Block missing consent default or unusable destination
        if: steps.preflight.outcome != 'success'
        run: |
          echo 'TBT target NO-GO/UNKNOWN. Inspect safe report; do not treat this as lead receipt.'
          exit 1
