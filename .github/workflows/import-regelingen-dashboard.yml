name: Import reviewed one-screen dashboard source
on:
  push:
    branches: [feat/regelingen-dashboard-one-screen]
    paths: [.github/workflows/import-regelingen-dashboard.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact approved main baseline
        run: test "$(git rev-parse HEAD^)" = 'f8eca4eb8288d75f92ad6fa99d5776789675a951'
      - name: Download and verify small source-only patch
        env:
          SOURCE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-9d1c-81f4-9897-08fc2d2092be/raw?se=2026-11-14T16%3A53%3A00Z&sp=r&sv=2026-06-06&sr=b&scid=13a09649-ee17-5109-b349-8f4c51c5431b&skoid=a4604a88-85e4-4562-b6ab-a5622268de80&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-14T10%3A14%3A33Z&ske=2026-11-15T10%3A14%3A33Z&sks=b&skv=2026-06-06&sig=pig0sEIlPasrbXWi7MiIdllKSqQRoSOF9OaTN8HHS6g%3D'
        run: |
          python3 <<'PY'
          import io,os,hashlib,zipfile,urllib.request,pathlib
          data=urllib.request.urlopen(os.environ['SOURCE_URL'],timeout=30).read(100000)
          assert len(data)==24154, 'Unexpected patch size'
          assert hashlib.sha256(data).hexdigest()=='6a2d6abb315cde9959af57249471f6e3b862abc3ac5c199f7e0e2188f6500ce8'
          allowed=set("""templates/regelingen-page.html
          assets/regelingen-app.js
          assets/regelingen.css
          assets/plan-bridge.js
          scripts/next/build.cjs
          tests/dashboard.test.cjs
          docs/REGELINGEN-DASHBOARD-REDESIGN.md""".splitlines())
          root=pathlib.Path.cwd()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert set(z.namelist())==allowed and len(z.infolist())==len(allowed)
              assert sum(i.file_size for i in z.infolist())<120000
              for name in sorted(allowed):
                  target=root/name
                  assert target.resolve().is_relative_to(root)
                  assert not target.is_symlink()
                  raw=z.read(name);raw.decode('utf-8')
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(raw)
          print('Applied 7 hash-verified UI source/test/docs files. No secrets, no workflow changes.')
          PY
      - name: Build and test complete site (no backend activation)
        run: |
          php -v
          npm run build
          npm test
          npm run package
          npm run preview:next
          node - <<'NODE'
          const fs=require('node:fs');
          if(!fs.readFileSync('regelingen/index.html','utf8').includes('id="r-panel-details"'))process.exit(1);
          if(JSON.parse(fs.readFileSync('next-version.json','utf8')).cloudDefault!=='disabled')process.exit(1);
          NODE
          git diff --check
          git diff --exit-code -- .github/workflows server/next api/next
      - name: Commit integrated design to isolated branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'feat: redesign regelingencheck as one-screen interactive dashboard'
          git push origin HEAD:refs/heads/feat/regelingen-dashboard-one-screen
