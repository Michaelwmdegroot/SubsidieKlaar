name: Import reviewed premium dashboard
on:
  push:
    branches: [feat/regelingen-dashboard-one-screen]
    paths: [.github/workflows/import-premium-dashboard.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact reviewed baseline
        run: test "$(git rev-parse HEAD^)" = '75423792ce0c4dd84792162ff673048c4b234235'
      - name: Import hash-verified UI and optimized decorative visuals only
        env:
          SOURCE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-affc-81f4-b5e6-ba3d36e4e2fb/raw?se=2026-11-14T18%3A36%3A08Z&sp=r&sv=2026-06-06&sr=b&scid=75380657-b257-5b97-a293-d338e69f9579&skoid=a4604a88-85e4-4562-b6ab-a5622268de80&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-14T09%3A54%3A37Z&ske=2026-11-15T09%3A54%3A37Z&sks=b&skv=2026-06-06&sig=SrLcUqjyir7sagN9YIuC2BELypnic1r0pCm0Y0njdb4%3D'
        run: |
          python3 <<'PY'
          import io,os,hashlib,zipfile,urllib.request,pathlib
          raw=urllib.request.urlopen(os.environ['SOURCE_URL'],timeout=30).read(400000)
          assert len(raw)==254695
          assert hashlib.sha256(raw).hexdigest()=='3f582d7ae944dbd4f4e66ebb1377f7e4489b324e4cb2299b527df6d00ce45a57'
          allowed=set('''AGENTS.md
          templates/regelingen-page.html
          assets/regelingen-app.js
          assets/regelingen.css
          scripts/build-site.cjs
          tests/dashboard.test.cjs
          tests/premium-dashboard.test.cjs
          docs/PREMIUM-DASHBOARD-RELEASE.md
          docs/DASHBOARD-ASSETS.json
          assets/images/dashboard-home.webp
          assets/images/dashboard-home-small.webp
          assets/images/dashboard-dossier.webp
          assets/images/dashboard-sustainability.webp
          assets/images/dashboard-trust.webp'''.splitlines())
          root=pathlib.Path.cwd()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert len(z.infolist())==len(allowed) and set(z.namelist())==allowed
              assert sum(i.file_size for i in z.infolist())<500000
              for name in sorted(allowed):
                  target=root/name
                  assert target.resolve().is_relative_to(root) and not target.is_symlink()
                  data=z.read(name)
                  if name.endswith('.webp'): assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
                  else: data.decode('utf-8')
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
          print('14 reviewed application/asset/test/docs files imported. No credentials, user data or workflow edits.')
          PY
      - name: Build and verify complete site without backend changes
        run: |
          php -v
          npm run build
          npm test
          npm run package
          npm run preview:next
          node -e "if(require('./version.json').build!=='9638cd65c49b0c39') process.exit(1)"
          git diff --exit-code -- .github/workflows server api assets/core.js assets/export.js assets/metrics.js scripts/regelingen-engine.cjs assets/plan-bridge.js
          git diff --check
      - name: Commit only source and generated outputs to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'feat: bring approved premium image-led design to the regelingen dashboard'
          git push origin HEAD:refs/heads/feat/regelingen-dashboard-one-screen
