name: Materialize tested SubsidieReady release
on:
  push:
    branches: [release/subsidieready-v1]
    paths: ['.release-transfer/**', '.github/workflows/materialize-release.yml']
permissions:
  contents: write
jobs:
  materialize:
    if: github.ref == 'refs/heads/release/subsidieready-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hash-verified locally tested source changes
        shell: python
        run: |
          import gzip, hashlib, json, pathlib, shutil
          root = pathlib.Path.cwd()
          parts = sorted((root / '.release-transfer').glob('part-*.gz'))
          assert len(parts) == 4, 'Expected four transport chunks'
          packed = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(packed).hexdigest() == 'c82506f00d3ef6f9273ccd548bc6d185d35bbcce92f1a3e91aff2f189fd9fe31'
          manifest = json.loads(gzip.decompress(packed))
          assert manifest['format'] == 1
          def target(name):
              rel = pathlib.PurePosixPath(name)
              assert not rel.is_absolute() and '..' not in rel.parts
              assert rel.parts[0] not in ('.git', '.github', '.release-transfer')
              return root / rel
          for entry in manifest['existing']:
              path = target(entry['path'])
              before = path.read_bytes()
              assert hashlib.sha256(before).hexdigest() == entry['before'], entry['path']
              text = before.decode('utf-8')
              for start, end, replacement in reversed(entry['ops']):
                  text = text[:start] + replacement + text[end:]
              after = text.encode('utf-8')
              assert hashlib.sha256(after).hexdigest() == entry['after'], entry['path']
              path.write_bytes(after)
          for entry in manifest['new']:
              path = target(entry['path'])
              assert not path.exists(), entry['path']
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(entry['content'], encoding='utf-8')
          shutil.rmtree(root / '.release-transfer')
          print('Applied locally tested source manifest; all pre/post hashes matched.')
      - name: Build, test and package release
        run: php -v && npm run build && npm test && npm run package
      - name: Commit verified release sources on development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --name-only | grep -q '^.github/'; then
            echo 'Unexpected workflow mutation; refusing push.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'feat: materialize tested SubsidieReady 1.0 website and private backoffice'
          git push origin HEAD:release/subsidieready-v1
      - uses: actions/upload-artifact@v4
        with:
          name: SubsidieReady-hostinger
          path: dist/
          retention-days: 14
