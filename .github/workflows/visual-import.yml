name: Import verified visual release
on:
  push:
    branches: [design/premium-visual-refresh]
    paths: [.github/workflows/visual-import.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/design/premium-visual-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize verified public-release source assets
        shell: python
        run: |
          import urllib.request, hashlib, zipfile, io, json, pathlib
          # This short-lived URL carries ONLY the generated public website patch.
          # No customer files, fonts, config, credentials or private account records.
          url='https://sdmntprnortheu.oaiusercontent.com/files/00000000-e848-81f4-bdd3-97a680b82f63/raw?se=2026-11-14T03%3A07%3A22Z&sp=r&sv=2026-06-06&sr=b&scid=0579e5a0-6c63-5780-8605-40ab8cd7c27e&skoid=a4604a88-85e4-4562-b6ab-a5622268de80&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-13T19%3A40%3A08Z&ske=2026-11-14T19%3A40%3A08Z&sks=b&skv=2026-06-06&sig=A9OEk30869xl%2BMtH3YwNvAxgW0rjAvt/4EdIlEjgl5M%3D'
          with urllib.request.urlopen(url, timeout=40) as response:
              raw=response.read(1000001)
          assert len(raw)<1000000
          assert hashlib.sha256(raw).hexdigest()=='87bd7ed8462c8ae46472b25b35d2ac16fa402776c58918317586acc7dbabcb9d'
          allowed={'assets/app.js','assets/style.css','assets/mark.svg','assets/images/home-hero.webp','assets/images/home-hero-small.webp','admin/index.php','scripts/build-site.cjs','scripts/build.cjs','scripts/serve.cjs','templates/index.html','tests/release-gates.test.cjs','tests/visual.test.cjs','docs/VISUAL-REFRESH.md','docs/DEVELOPMENT-HANDOFF.md'}
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              assert set(archive.namelist())==allowed|{'PATCH-MANIFEST.json'}
              manifest=json.loads(archive.read('PATCH-MANIFEST.json'))
              assert manifest['base']=='523f953d2e97410e138cc86d9c1ec49aa46f3e86'
              assert manifest['build']=='5dafe5e90928c9e8'
              assert set(manifest['files'])==allowed
              for name in sorted(allowed):
                  info=archive.getinfo(name)
                  assert info.file_size<1000000
                  data=archive.read(name)
                  assert hashlib.sha256(data).hexdigest()==manifest['files'][name]
                  target=pathlib.Path(name)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
          print('14 source files verified and materialized; protected application logic unchanged.')
      - name: Test and regenerate the full release
        run: |
          php -v
          npm run build
          npm test
          npm run package
          test "$(node -p "require('./version.json').build")" = '5dafe5e90928c9e8'
          git diff --exit-code -- assets/core.js assets/export.js assets/metrics.js server api
          git diff --check
      - name: Commit tested sources and generated site, remove temporary transport
        run: |
          rm .github/workflows/visual-import.yml
          git add assets admin scripts templates tests docs index.html 404.html .htaccess robots.txt sitemap.xml version.json concept hulp privacy bronnen over .github/workflows/visual-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'design: implement full SubsidieReady visual refresh with local imagery'
          git push origin HEAD:design/premium-visual-refresh
