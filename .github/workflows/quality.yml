name: SubsidieReady quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Require PHP for real backend regression tests
        run: |
          php -v
          php -r 'exit(extension_loaded("fileinfo") && (extension_loaded("sodium") || (extension_loaded("openssl") && in_array("aes-256-gcm", openssl_get_cipher_methods(), true))) ? 0 : 1);'
      - run: npm run build
      - run: npm test
      - run: npm run package
      - name: Verify public SEO and disabled lead pilot
        run: node scripts/audit-seo.cjs && node scripts/lead-pilot.cjs --check
      - name: Generated site is committed and reproducible
        run: git diff --exit-code -- index.html .htaccess robots.txt sitemap.xml version.json next-version.json concept hulp privacy voorwaarden bronnen over regelingen subsidies btw financiering mijn-plan advies sales bronbeheer assets/regelingen-engine.js
      - run: git diff --check
