name: Concept quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} — tests and portable build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run regression tests
        run: npm test

      - name: Rebuild standalone concept
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Verify committed standalone HTML is up to date
        run: git diff --exit-code -- concept/SubsidieKlaar-concept.html
