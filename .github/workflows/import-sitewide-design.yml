name: Import reviewed sitewide design
on:
  push:
    branches: [feat/sitewide-premium-design]
    paths: [.github/workflows/import-sitewide-design.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact reviewed baseline
        run: test "$(git rev-parse HEAD^)" = '06cdbe4c6ba718fe83dbd419d78615082d9995f8'
      - name: Import bounded hash-verified presentation sources
        env:
          SOURCE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-b690-81f4-8b06-fbd9cebd2c4b/raw?se=2026-11-14T19%3A31%3A05Z&sp=r&sv=2026-06-06&sr=b&scid=0f9b49c7-0ea4-57b3-8abf-2f30fac080c4&skoid=a4604a88-85e4-4562-b6ab-a5622268de80&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-14T09%3A23%3A56Z&ske=2026-11-15T09%3A23%3A56Z&sks=b&skv=2026-06-06&sig=hMzA7eIvcVDtu04oTKaQhl3%2BFW6mrkdPA2hcxvIaxNk%3D'
        run: |
          python3 <<'PY'
          import io,os,hashlib,zipfile,urllib.request,pathlib
          raw=urllib.request.urlopen(os.environ['SOURCE_URL'],timeout=30).read(200000)
          assert len(raw)==95244
          assert hashlib.sha256(raw).hexdigest()=='4c49eef61b6323decd241afeff652425684014574d526a61b489a60da8f4924f'
          allowed=set('''AGENTS.md
          README.md
          admin/index.php
          assets/advice-app.js
          assets/app.js
          assets/plan-app.js
          assets/site-theme.css
          templates/index.html
          scripts/site-design.cjs
          scripts/build-site.cjs
          scripts/build.cjs
          scripts/next/build.cjs
          scripts/next/offline.cjs
          scripts/regeling-pages.cjs
          scripts/sitewide/render_utils.py
          scripts/sitewide/browser_check.py
          tests/release-gates.test.cjs
          tests/visual.test.cjs
          tests/site-theme.test.cjs
          docs/SITEWIDE-DESIGN-RELEASE.md'''.splitlines())
          root=pathlib.Path.cwd()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert len(z.infolist())==len(allowed) and set(z.namelist())==allowed
              assert sum(i.file_size for i in z.infolist())<400000
              for name in sorted(allowed):
                  target=root/name
                  assert target.resolve().is_relative_to(root) and not target.is_symlink()
                  data=z.read(name);data.decode('utf-8')
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
          print('20 reviewed UTF-8 presentation/test/docs files imported. No private data, fonts, assets or workflow changes.')
          PY
      - name: Build and verify site without changing data rules or backend
        run: |
          php -v
          npm run build
          npm test
          npm run package
          npm run preview:next
          node -e "if(require('./version.json').build!=='a95e1539d1244098'||require('./next-version.json').build!=='6377d2731227bf88') process.exit(1)"
          git diff --exit-code -- .github/workflows server api assets/core.js assets/export.js assets/metrics.js scripts/regelingen-engine.cjs assets/regelingen-app.js assets/regelingen.css assets/plan-core.js assets/workbench-rules.js assets/next-api.js assets/plan-bridge.js assets/sales-app.js
          git diff --check
      - name: Commit source and generated outputs to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'feat: unify all SubsidieReady pages with approved premium design system'
          git push origin HEAD:refs/heads/feat/sitewide-premium-design
